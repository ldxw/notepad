services:
  notepad:
    container_name: notepad
    # 用自己的镜像（CI 会构建并推送到 docker.io/ldxw/notepad）
    # 想跑上游原版镜像可以换回：athlon1600/notepad:latest
    image: ldxw/notepad:latest
    environment:
      NODE_ENV: production
      # ── 运行时页面元信息（留空 = 用构建时 site.config.js 里的默认值）──────────
      # 语言相关项支持 _ZH / _EN 后缀：中文界面用 _ZH、英文界面用 _EN，
      # 切换语言时 <title>、description/keywords、页头名字都会跟着换；
      # 不带后缀的是所有语言的通用兜底。改完重启容器即生效，无需重新构建。
      SITE_TITLE: ${SITE_TITLE:-}
      SITE_TITLE_ZH: ${SITE_TITLE_ZH:-}
      SITE_TITLE_EN: ${SITE_TITLE_EN:-}
      SITE_DESCRIPTION: ${SITE_DESCRIPTION:-}
      SITE_DESCRIPTION_ZH: ${SITE_DESCRIPTION_ZH:-}
      SITE_DESCRIPTION_EN: ${SITE_DESCRIPTION_EN:-}
      SITE_KEYWORDS: ${SITE_KEYWORDS:-}
      SITE_KEYWORDS_ZH: ${SITE_KEYWORDS_ZH:-}
      SITE_KEYWORDS_EN: ${SITE_KEYWORDS_EN:-}
      SITE_AUTHOR: ${SITE_AUTHOR:-}
      SITE_NAME: ${SITE_NAME:-}
      SITE_NAME_ZH: ${SITE_NAME_ZH:-}
      SITE_NAME_EN: ${SITE_NAME_EN:-}
      # 默认界面语言：auto（跟随浏览器，默认）/ zh / en
      SITE_LANG: ${SITE_LANG:-}
      # 口令哈希用的 salt（默认 notepad.mx；换掉后与其它实例的笔记互不通用，见 README）
      SITE_SALT: ${SITE_SALT:-}
      # 站点图标：填完整 URL 或 /my.ico 这样的路径；留空用内置的 favicon.ico
      SITE_ICON: ${SITE_ICON:-}
      # 默认主题：auto（跟随系统，默认）/ light / dark；访客自己切过的主题优先
      SITE_THEME: ${SITE_THEME:-}
      # ── 容器内定时归档（backend/bin/archive.sh）────────────────────────────
      # 容器时区：cron 的小时数按这个时区计算（默认 UTC 会导致时间不对）
      TZ: ${TZ:-Asia/Shanghai}
      # 归档时间：标准 5 段 cron 表达式；"off" 可关闭。默认每天 03:30
      ARCHIVE_CRON: "${ARCHIVE_CRON:-30 3 * * *}"
#    build:
#      context: "."
#      target: "runner"
    volumes:
      - ./backend/storage:/app/backend/storage
      - ./backend/public:/app/backend/public
    ports:
      - "3000:3000"
