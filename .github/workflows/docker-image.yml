name: 多架构镜像构建与推送

# 只保留**手动构建**：Actions 页面 → Run workflow（三个仓库开关默认全开 + 强制构建）
# 自动构建已关闭 —— 原来的 push / tag 触发注释在下面，需要时解开即可。
on:
  # push:
  #   branches:
  #     - upstream-latest
  #   tags:
  #     - "v*"

  workflow_dispatch:
    inputs:
      pushToHub:
        description: "推送到 Docker Hub（docker.io/ldxw/notepad）"
        type: boolean
        default: true
      pushToGhcr:
        description: "推送到 GitHub Packages（ghcr.io/ldxw/notepad）"
        type: boolean
        default: true
      pushToAliyun:
        description: "推送到阿里云（registry.cn-hangzhou.aliyuncs.com/ldxw-git/notepad）"
        type: boolean
        default: true
      forceBuild:
        description: "强制构建（忽略构建缓存，全部从零重编）"
        type: boolean
        default: false
      makeRelease:
        description: "构建成功后创建 Release（镜像地址 + 包介绍）"
        type: boolean
        default: true

# ghcr.io 用内置 GITHUB_TOKEN 推送；创建 Release 需要 contents: write
permissions:
  contents: write
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  # 多架构：amd64（常见 x86 服务器）+ arm64（Oracle ARM / 树莓派等）
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  build:
    runs-on: ubuntu-latest

    # secrets 不能写在 if/lint 条件里，先注入 env 再用 env 判断
    # push 触发时 inputs.* 为空 —— 下面脚本用 ${VAR:-true} 兜底成"全部推送"
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      ALIYUN_DOCKER_USERNAME: ${{ secrets.ALIYUN_DOCKER_USERNAME }}
      ALIYUN_DOCKER_TOKEN: ${{ secrets.ALIYUN_DOCKER_TOKEN }}
      INPUT_PUSH_HUB: ${{ inputs.pushToHub }}
      INPUT_PUSH_GHCR: ${{ inputs.pushToGhcr }}
      INPUT_PUSH_ALIYUN: ${{ inputs.pushToAliyun }}
      INPUT_FORCE: ${{ inputs.forceBuild }}
      INPUT_RELEASE: ${{ inputs.makeRelease }}

    steps:
      - name: 📥 拉取代码
        uses: actions/checkout@v4

      - name: 🧮 计算推送目标（hub / ghcr / 阿里云）
        id: images
        run: |
          set -euo pipefail

          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"

          # 未勾选/自动触发 → 默认 true（全部推送）
          want_hub="${INPUT_PUSH_HUB:-true}"
          want_ghcr="${INPUT_PUSH_GHCR:-true}"
          want_aliyun="${INPUT_PUSH_ALIYUN:-true}"
          force="${INPUT_FORCE:-false}"
          want_release="${INPUT_RELEASE:-true}"

          images=()
          do_ghcr=false
          do_hub=false
          do_aliyun=false

          if [ "${want_ghcr}" = "true" ]; then
            images+=("ghcr.io/${owner}/notepad")
            do_ghcr=true
          fi

          if [ "${want_hub}" = "true" ]; then
            if [ -n "${DOCKERHUB_USERNAME:-}" ] && [ -n "${DOCKERHUB_TOKEN:-}" ]; then
              images+=("docker.io/${DOCKERHUB_USERNAME}/notepad")
              do_hub=true
            else
              echo "::warning::勾选了 Docker Hub，但缺少 DOCKERHUB_USERNAME / DOCKERHUB_TOKEN，本次跳过"
            fi
          fi

          if [ "${want_aliyun}" = "true" ]; then
            if [ -n "${ALIYUN_DOCKER_USERNAME:-}" ] && [ -n "${ALIYUN_DOCKER_TOKEN:-}" ]; then
              images+=("registry.cn-hangzhou.aliyuncs.com/ldxw-git/notepad")
              do_aliyun=true
            else
              echo "::warning::勾选了阿里云，但缺少 ALIYUN_DOCKER_USERNAME / ALIYUN_DOCKER_TOKEN，本次跳过"
            fi
          fi

          if [ "${#images[@]}" -eq 0 ]; then
            echo "::error::没有任何可推送的镜像仓库，请检查开关与密钥"
            exit 1
          fi

          echo "本次推送目标："
          printf '  → %s\n' "${images[@]}"
          echo "强制构建：${force}"

          {
            echo "list<<__IMAGES_EOF__"
            printf '%s\n' "${images[@]}"
            echo "__IMAGES_EOF__"
            echo "do_hub=${do_hub}"
            echo "do_ghcr=${do_ghcr}"
            echo "do_aliyun=${do_aliyun}"
            echo "force=${force}"
            echo "release=${want_release}"
          } >> "$GITHUB_OUTPUT"

      - name: 🛠️ 配置多架构支持 (QEMU)
        uses: docker/setup-qemu-action@v3

      - name: 🐳 配置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔒 登录 Docker Hub
        if: steps.images.outputs.do_hub == 'true'
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: 🔒 登录 GitHub Packages (ghcr.io)
        if: steps.images.outputs.do_ghcr == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔒 登录阿里云 Docker 镜像仓库
        if: steps.images.outputs.do_aliyun == 'true'
        uses: docker/login-action@v3
        with:
          registry: registry.cn-hangzhou.aliyuncs.com
          username: ${{ env.ALIYUN_DOCKER_USERNAME }}
          password: ${{ env.ALIYUN_DOCKER_TOKEN }}

      - name: 🏷️ 生成镜像标签（latest + 时间）
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.images.outputs.list }}
          tags: |
            type=raw,value=latest
            type=raw,value={{date 'YYYY-MM-DD-HHmm'}}

      - name: 🚀 构建并推送多架构镜像
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: ${{ env.PLATFORMS }}
          # 用 image exporter 取代 push: true，才能带上 oci-mediatypes=false：
          # 阿里云 ACR 只认 Docker manifest list，不认 OCI image index，否则报
          # "denied: unknown manifest class for application/vnd.oci.image.index.v1+json"
          outputs: type=image,oci-mediatypes=false,push=true
          # 关闭 attestation，避免 index 里混入 unknown/unknown 的证明清单
          provenance: false
          sbom: false
          no-cache: ${{ steps.images.outputs.force }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 📋 汇总本次推送的镜像地址
        run: |
          {
            echo "### 本次推送的镜像"
            echo ""
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo ""
            echo "强制构建：${{ steps.images.outputs.force }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 📦 发布 Release（镜像地址 + 包介绍 + 快速开始）
        if: steps.images.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          REPO="${{ github.repository }}"
          SHA="${{ github.sha }}"
          DIGEST="${{ steps.build.outputs.digest }}"
          PLATFORMS="${{ env.PLATFORMS }}"
          REPO_DESC="${{ github.event.repository.description }}"
          NOTES=/tmp/notes.md
          TABLE=/tmp/imgtable.md

          # 取时间标签（metadata-action 生成的、不是 latest 的那个）作为 Release 标签
          TAG="$(printf '%s\n' "${{ steps.meta.outputs.tags }}" | sed -E 's#^.*:##' | grep -v '^latest$' | head -1)"
          if [ -z "$TAG" ]; then
            TAG="$(date -u '+%Y-%m-%d-%H%M')"
          fi

          FIRST_IMG="$(printf '%s\n' "${{ steps.images.outputs.list }}" | head -1)"

          # 每个镜像仓库一行
          : > "$TABLE"
          while IFS= read -r img; do
            [ -z "$img" ] && continue
            printf '| `%s` | `latest`, `%s` | `docker pull %s:latest` |\n' "$img" "$TAG" "$img" >> "$TABLE"
          done <<< "${{ steps.images.outputs.list }}"

          {
            echo "## 🗒️ 在线记事本 · 镜像发布 \`$TAG\`"
            echo
            echo "> $REPO_DESC"
            echo
            echo "自托管在线记事本：笔记在浏览器端加密后才上传，中英双语界面，首页预渲染为静态 HTML，容器内每日自动归档。"
            echo
            echo "### 📦 镜像地址"
            echo
            echo "| 仓库 | 标签 | 拉取 |"
            echo "|---|---|---|"
            cat "$TABLE"
            echo
            echo "### 🖥️ 平台 / 摘要"
            echo
            echo "- 架构：\`$PLATFORMS\`（多架构 manifest list）"
            echo "- 摘要：\`${DIGEST:-见构建日志}\`"
            echo "- 提交：\`$SHA\`"
            echo
            echo "### 🚀 快速开始"
            echo
            echo '```bash'
            echo "docker run -d --name notepad -p 3000:3000 -e TZ=Asia/Shanghai ${FIRST_IMG}:latest"
            echo '```'
            echo
            echo "或使用仓库里的 compose：\`docker compose up -d\`（compose 里已指向该镜像）"
            echo
            echo "### ⚙️ 可用环境变量"
            echo
            echo "| 变量 | 说明 |"
            echo "|---|---|"
            echo '| `SITE_TITLE` / `SITE_DESCRIPTION` / `SITE_KEYWORDS` / `SITE_AUTHOR` | 页面元信息（运行期注入 index.html，改完重启容器即生效） |'
            echo '| `TZ` | 时区，容器内 cron 按它计算（默认 UTC） |'
            echo '| `ARCHIVE_CRON` | 每日归档时间，默认 `30 3 * * *`，设 `off` 关闭 |'
            echo
            echo "### ✨ 特性"
            echo
            echo "- 🔐 笔记在客户端加密后才上传（服务端只有密文）"
            echo "- 🌐 中英双语 + 头部语言切换（自动识别浏览器语言并用 localStorage 记忆）"
            echo "- 🔎 首页预渲染成静态 HTML，便于搜索引擎收录"
            echo "- 💾 容器内每日自动归档到 \`backend/public/backups/\`"
            echo "- 🧱 多架构镜像：$PLATFORMS"
          } > "$NOTES"

          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$REPO" --title "镜像 $TAG" --notes-file "$NOTES"
            echo "已更新 Release：$TAG"
          else
            gh release create "$TAG" --repo "$REPO" --title "镜像 $TAG" --target "$SHA" --notes-file "$NOTES" --latest
            echo "已创建 Release：$TAG"
          fi

          {
            echo ""
            echo "### 📦 Release"
            echo ""
            echo "- 标签：\`$TAG\`  → ${{ github.server_url }}/$REPO/releases/tag/$TAG"
          } >> "$GITHUB_STEP_SUMMARY"
