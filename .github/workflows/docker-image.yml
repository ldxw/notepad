name: 多构架镜像

on:
  # push:
  #  branches:
  #    - master
  workflow_dispatch:
    inputs:
      pushToAliyun:
        description: '是否推送到阿里云Docker镜像仓库？'
        type: boolean
        required: true
        default: false


jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 拉取代码
        uses: actions/checkout@v4

      - name: 🛠️ 配置多架构支持
        uses: docker/setup-qemu-action@v3

      - name: 🐳 配置Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔒 登录Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          
      - name: 🔒 登录 GitHub Packages
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: 🔒 登录阿里云Docker镜像仓库
        if: ${{ github.event.inputs.pushToAliyun == 'true' }}
        uses: docker/login-action@v3
        with:
          registry: registry.cn-hangzhou.aliyuncs.com
          username: ${{ secrets.ALIYUN_DOCKER_USERNAME }}
          password: ${{ secrets.ALIYUN_DOCKER_TOKEN }}

      - name: ⏰ 获取当前时间并设置为环境变量
        id: time
        run: |
          FORMATTED_TIME=$(date +'%Y%m%d%H%M')
          echo "FORMATTED_TIME=$FORMATTED_TIME" >> $GITHUB_ENV

      - name: 🚀 构建推送多架构镜像
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64  # 多架构构建
          push: true
          tags: |
            docker.io/ldxw/notepad:var-re
            docker.io/ldxw/notepad:var-re-${{ env.FORMATTED_TIME }}
            ghcr.io/ldxw/notepad:var-re
            ghcr.io/ldxw/notepad:var-re-${{ env.FORMATTED_TIME }}
            ${{ github.event.inputs.pushToAliyun == 'true' && format('registry.cn-hangzhou.aliyuncs.com/ldxw-git/notepad:var-re', env.FORMATTED_TIME) || '' }}
            ${{ github.event.inputs.pushToAliyun == 'true' && format('registry.cn-hangzhou.aliyuncs.com/ldxw-git/notepad:var-re-{0}', env.FORMATTED_TIME) || '' }}