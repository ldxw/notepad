name: 多架构镜像构建与推送

# 只保留**手动构建**：Actions 页面 → Run workflow（三个仓库开关默认全开 + 强制构建）
# 自动构建已关闭 —— 原来的 push / tag 触发注释在下面，需要时解开即可。
on:
  # push:
  #   branches:
  #     - upstream-latest
  #   tags:
  #     - "v*"

  workflow_dispatch:
    inputs:
      pushToHub:
        description: "推送到 Docker Hub（docker.io/ldxw/notepad）"
        type: boolean
        default: true
      pushToGhcr:
        description: "推送到 GitHub Packages（ghcr.io/ldxw/notepad）"
        type: boolean
        default: true
      pushToAliyun:
        description: "推送到阿里云（registry.cn-hangzhou.aliyuncs.com/ldxw-git/notepad）"
        type: boolean
        default: true
      forceBuild:
        description: "强制构建（忽略构建缓存，全部从零重编）"
        type: boolean
        default: false
      siteLang:
        description: "预渲染（静态 HTML）用的界面语言：单个 zh / en，或逗号分隔的多个（如 zh,en 表示中英各渲染一份，运行时按访客语言挑）"
        type: string
        default: "zh,en"

# ghcr.io 用内置 GITHUB_TOKEN 推送，需要 packages: write
permissions:
  contents: write
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  # 多架构：amd64（常见 x86 服务器）+ arm64（Oracle ARM / 树莓派等）
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  build:
    runs-on: ubuntu-latest

    # secrets 不能写在 if/lint 条件里，先注入 env 再用 env 判断
    # push 触发时 inputs.* 为空 —— 下面脚本用 ${VAR:-true} 兜底成"全部推送"
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      ALIYUN_DOCKER_USERNAME: ${{ secrets.ALIYUN_DOCKER_USERNAME }}
      ALIYUN_DOCKER_TOKEN: ${{ secrets.ALIYUN_DOCKER_TOKEN }}
      INPUT_PUSH_HUB: ${{ inputs.pushToHub }}
      INPUT_PUSH_GHCR: ${{ inputs.pushToGhcr }}
      INPUT_PUSH_ALIYUN: ${{ inputs.pushToAliyun }}
      INPUT_FORCE: ${{ inputs.forceBuild }}
      # 时间统一按国内时间（+8）。注意：镜像标签的时区是靠 metadata-action 的
      # tz='Asia/Shanghai' 显式指定的（它默认 UTC，不看这里的 TZ）；这里设 TZ
      # 是为了让脚本里非显式的 date 调用也按国内时间。
      TZ: Asia/Shanghai

    steps:
      - name: 📥 拉取代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: 🧮 计算推送目标（hub / ghcr / 阿里云）
        id: images
        run: |
          set -euo pipefail

          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"

          # 未勾选/自动触发 → 默认 true（全部推送）
          want_hub="${INPUT_PUSH_HUB:-true}"
          want_ghcr="${INPUT_PUSH_GHCR:-true}"
          want_aliyun="${INPUT_PUSH_ALIYUN:-true}"
          force="${INPUT_FORCE:-false}"

          images=()
          do_ghcr=false
          do_hub=false
          do_aliyun=false

          if [ "${want_ghcr}" = "true" ]; then
            images+=("ghcr.io/${owner}/notepad")
            do_ghcr=true
          fi

          if [ "${want_hub}" = "true" ]; then
            if [ -n "${DOCKERHUB_USERNAME:-}" ] && [ -n "${DOCKERHUB_TOKEN:-}" ]; then
              images+=("docker.io/${DOCKERHUB_USERNAME}/notepad")
              do_hub=true
            else
              echo "::warning::勾选了 Docker Hub，但缺少 DOCKERHUB_USERNAME / DOCKERHUB_TOKEN，本次跳过"
            fi
          fi

          if [ "${want_aliyun}" = "true" ]; then
            if [ -n "${ALIYUN_DOCKER_USERNAME:-}" ] && [ -n "${ALIYUN_DOCKER_TOKEN:-}" ]; then
              images+=("registry.cn-hangzhou.aliyuncs.com/ldxw-git/notepad")
              do_aliyun=true
            else
              echo "::warning::勾选了阿里云，但缺少 ALIYUN_DOCKER_USERNAME / ALIYUN_DOCKER_TOKEN，本次跳过"
            fi
          fi

          if [ "${#images[@]}" -eq 0 ]; then
            echo "::error::没有任何可推送的镜像仓库，请检查开关与密钥"
            exit 1
          fi

          echo "本次推送目标："
          printf '  → %s\n' "${images[@]}"
          echo "强制构建：${force}"

          {
            echo "list<<__IMAGES_EOF__"
            printf '%s\n' "${images[@]}"
            echo "__IMAGES_EOF__"
            echo "do_hub=${do_hub}"
            echo "do_ghcr=${do_ghcr}"
            echo "do_aliyun=${do_aliyun}"
            echo "force=${force}"
          } >> "$GITHUB_OUTPUT"

      - name: 🛠️ 配置多架构支持 (QEMU)
        uses: docker/setup-qemu-action@v3

      - name: 🐳 配置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔒 登录 Docker Hub
        if: steps.images.outputs.do_hub == 'true'
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: 🔒 登录 GitHub Packages (ghcr.io)
        if: steps.images.outputs.do_ghcr == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔒 登录阿里云 Docker 镜像仓库
        if: steps.images.outputs.do_aliyun == 'true'
        uses: docker/login-action@v3
        with:
          registry: registry.cn-hangzhou.aliyuncs.com
          username: ${{ env.ALIYUN_DOCKER_USERNAME }}
          password: ${{ env.ALIYUN_DOCKER_TOKEN }}

      - name: 🏷️ 生成镜像标签（每个分支只管自己那组）
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.images.outputs.list }}
          tags: |
            # upstream-latest → latest + 时间
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/upstream-latest' }}
            type=raw,value={{date 'YYYY-MM-DD-HHmm' tz='Asia/Shanghai'}},enable=${{ github.ref == 'refs/heads/upstream-latest' }}
            # 其它分支（主题开发）→ theme + theme-时间，不碰主线的标签
            type=raw,value=theme,enable=${{ github.ref != 'refs/heads/upstream-latest' }}
            type=raw,value=theme-{{date 'YYYY-MM-DD-HHmm' tz='Asia/Shanghai'}},enable=${{ github.ref != 'refs/heads/upstream-latest' }}

      - name: 🚀 构建并推送多架构镜像
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          build-args: |
            SITE_LANG=${{ inputs.siteLang }}
          platforms: ${{ env.PLATFORMS }}
          # 用 image exporter 取代 push: true，才能带上 oci-mediatypes=false：
          # 阿里云 ACR 只认 Docker manifest list，不认 OCI image index，否则报
          # "denied: unknown manifest class for application/vnd.oci.image.index.v1+json"
          outputs: type=image,oci-mediatypes=false,push=true
          # 关闭 attestation，避免 index 里混入 unknown/unknown 的证明清单
          provenance: false
          sbom: false
          no-cache: ${{ steps.images.outputs.force }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 📋 汇总本次推送的镜像地址
        run: |
          {
            echo "### 本次推送的镜像"
            echo ""
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo ""
            echo "强制构建：${{ steps.images.outputs.force }}"
          } >> "$GITHUB_STEP_SUMMARY"
