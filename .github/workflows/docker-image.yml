name: 多架构镜像构建与推送

# 只保留**手动构建**：Actions 页面 → Run workflow（三个仓库开关默认全开 + 强制构建）
# 自动构建已关闭 —— 原来的 push / tag 触发注释在下面，需要时解开即可。
on:
  # push:
  #   branches:
  #     - upstream-latest
  #   tags:
  #     - "v*"

  workflow_dispatch:
    inputs:
      pushToHub:
        description: "推送到 Docker Hub（docker.io/ldxw/notepad）"
        type: boolean
        default: true
      pushToGhcr:
        description: "推送到 GitHub Packages（ghcr.io/ldxw/notepad）"
        type: boolean
        default: true
      pushToAliyun:
        description: "推送到阿里云（registry.cn-hangzhou.aliyuncs.com/ldxw-git/notepad）"
        type: boolean
        default: true
      forceBuild:
        description: "强制构建（忽略构建缓存，全部从零重编）"
        type: boolean
        default: false
      makeRelease:
        description: "构建成功后创建 Release（发布说明 + 镜像地址 + 打包好的镜像 + SHA256SUMS）"
        type: boolean
        default: true

# ghcr.io 用内置 GITHUB_TOKEN 推送；创建 Release 需要 contents: write
permissions:
  contents: write
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  # 多架构：amd64（常见 x86 服务器）+ arm64（Oracle ARM / 树莓派等）
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  build:
    runs-on: ubuntu-latest

    # secrets 不能写在 if/lint 条件里，先注入 env 再用 env 判断
    # push 触发时 inputs.* 为空 —— 下面脚本用 ${VAR:-true} 兜底成"全部推送"
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      ALIYUN_DOCKER_USERNAME: ${{ secrets.ALIYUN_DOCKER_USERNAME }}
      ALIYUN_DOCKER_TOKEN: ${{ secrets.ALIYUN_DOCKER_TOKEN }}
      INPUT_PUSH_HUB: ${{ inputs.pushToHub }}
      INPUT_PUSH_GHCR: ${{ inputs.pushToGhcr }}
      INPUT_PUSH_ALIYUN: ${{ inputs.pushToAliyun }}
      INPUT_FORCE: ${{ inputs.forceBuild }}
      INPUT_RELEASE: ${{ inputs.makeRelease }}

    steps:
      - name: 📥 拉取代码
        uses: actions/checkout@v4
        with:
          # 生成「更新说明」需要完整历史与既有标签
          fetch-depth: 0
          fetch-tags: true

      - name: 🧮 计算推送目标（hub / ghcr / 阿里云）
        id: images
        run: |
          set -euo pipefail

          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"

          # 未勾选/自动触发 → 默认 true（全部推送）
          want_hub="${INPUT_PUSH_HUB:-true}"
          want_ghcr="${INPUT_PUSH_GHCR:-true}"
          want_aliyun="${INPUT_PUSH_ALIYUN:-true}"
          force="${INPUT_FORCE:-false}"
          want_release="${INPUT_RELEASE:-true}"

          images=()
          do_ghcr=false
          do_hub=false
          do_aliyun=false

          if [ "${want_ghcr}" = "true" ]; then
            images+=("ghcr.io/${owner}/notepad")
            do_ghcr=true
          fi

          if [ "${want_hub}" = "true" ]; then
            if [ -n "${DOCKERHUB_USERNAME:-}" ] && [ -n "${DOCKERHUB_TOKEN:-}" ]; then
              images+=("docker.io/${DOCKERHUB_USERNAME}/notepad")
              do_hub=true
            else
              echo "::warning::勾选了 Docker Hub，但缺少 DOCKERHUB_USERNAME / DOCKERHUB_TOKEN，本次跳过"
            fi
          fi

          if [ "${want_aliyun}" = "true" ]; then
            if [ -n "${ALIYUN_DOCKER_USERNAME:-}" ] && [ -n "${ALIYUN_DOCKER_TOKEN:-}" ]; then
              images+=("registry.cn-hangzhou.aliyuncs.com/ldxw-git/notepad")
              do_aliyun=true
            else
              echo "::warning::勾选了阿里云，但缺少 ALIYUN_DOCKER_USERNAME / ALIYUN_DOCKER_TOKEN，本次跳过"
            fi
          fi

          if [ "${#images[@]}" -eq 0 ]; then
            echo "::error::没有任何可推送的镜像仓库，请检查开关与密钥"
            exit 1
          fi

          echo "本次推送目标："
          printf '  → %s\n' "${images[@]}"
          echo "强制构建：${force}"

          {
            echo "list<<__IMAGES_EOF__"
            printf '%s\n' "${images[@]}"
            echo "__IMAGES_EOF__"
            echo "do_hub=${do_hub}"
            echo "do_ghcr=${do_ghcr}"
            echo "do_aliyun=${do_aliyun}"
            echo "force=${force}"
            echo "release=${want_release}"
          } >> "$GITHUB_OUTPUT"

      - name: 🛠️ 配置多架构支持 (QEMU)
        uses: docker/setup-qemu-action@v3

      - name: 🐳 配置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔒 登录 Docker Hub
        if: steps.images.outputs.do_hub == 'true'
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: 🔒 登录 GitHub Packages (ghcr.io)
        if: steps.images.outputs.do_ghcr == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔒 登录阿里云 Docker 镜像仓库
        if: steps.images.outputs.do_aliyun == 'true'
        uses: docker/login-action@v3
        with:
          registry: registry.cn-hangzhou.aliyuncs.com
          username: ${{ env.ALIYUN_DOCKER_USERNAME }}
          password: ${{ env.ALIYUN_DOCKER_TOKEN }}

      - name: 🏷️ 生成镜像标签（latest + 时间）
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.images.outputs.list }}
          tags: |
            type=raw,value=latest
            type=raw,value={{date 'YYYY-MM-DD-HHmm'}}

      - name: 🚀 构建并推送多架构镜像
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: ${{ env.PLATFORMS }}
          # 用 image exporter 取代 push: true，才能带上 oci-mediatypes=false：
          # 阿里云 ACR 只认 Docker manifest list，不认 OCI image index，否则报
          # "denied: unknown manifest class for application/vnd.oci.image.index.v1+json"
          outputs: type=image,oci-mediatypes=false,push=true
          # 关闭 attestation，避免 index 里混入 unknown/unknown 的证明清单
          provenance: false
          sbom: false
          no-cache: ${{ steps.images.outputs.force }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 📋 汇总本次推送的镜像地址
        run: |
          {
            echo "### 本次推送的镜像"
            echo ""
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo ""
            echo "强制构建：${{ steps.images.outputs.force }}"
          } >> "$GITHUB_STEP_SUMMARY"

      # 把已发布的镜像从 registry 取回来，导出成 docker load 可直接导入的 tar，
      # 连同 SHA256SUMS 一起作为 Release 附件 —— 没有 registry 权限 / 离线也能部署。
      - name: 🗜️ 打包镜像（docker load 可直接导入的 tar）
        if: steps.images.outputs.release == 'true'
        run: |
          set -euo pipefail

          TAG="$(printf '%s\n' "${{ steps.meta.outputs.tags }}" | sed -E 's#^.*:##' | grep -v '^latest$' | head -1 || true)"
          if [ -z "$TAG" ]; then
            TAG="$(date -u '+%Y-%m-%d-%H%M')"
          fi

          # 从本次推送的第一个仓库取（上面的登录步骤已经登录过，crane 会自动读 ~/.docker/config.json）
          REF="$(printf '%s\n' "${{ steps.images.outputs.list }}" | head -1):${TAG}"
          echo "打包来源：${REF}"

          PKG=/tmp/pkg
          mkdir -p "$PKG"

          # crane：导出带 RepoTags 的 tar（docker load 后直接就是 <仓库>:<标签>）
          curl -sSL -o /tmp/crane.tgz \
            "https://github.com/google/go-containerregistry/releases/download/v0.22.1/go-containerregistry_Linux_x86_64.tar.gz"
          tar -xzf /tmp/crane.tgz -C /tmp crane
          /tmp/crane version

          for arch in amd64 arm64; do
            out="${PKG}/notepad-${TAG}-linux-${arch}.tar"
            echo "→ 导出 linux/${arch} ..."
            /tmp/crane pull --platform "linux/${arch}" "${REF}" "${out}"
            ls -lh "$out"
          done

          # 镜像层本身就是 gzip 的，外层再压没有收益；直接给 tar
          # sha256sum -c SHA256SUMS 可直接校验下载下来的文件
          (cd "$PKG" && sha256sum ./*.tar > SHA256SUMS)
          echo "--- SHA256SUMS ---"
          cat "$PKG/SHA256SUMS"

      - name: 📦 发布 Release（发布说明 + 镜像地址 + 镜像包 + SHA256SUMS）
        if: steps.images.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          REPO="${{ github.repository }}"
          SHA="${{ github.sha }}"
          DIGEST="${{ steps.build.outputs.digest }}"
          PLATFORMS="${{ env.PLATFORMS }}"
          LIST="${{ steps.images.outputs.list }}"
          NOTES=/tmp/notes.md
          CHANGELOG=/tmp/changelog.md
          PKG=/tmp/pkg

          # Release 标签用镜像的时间标签（metadata-action 生成的、非 latest 的那个）
          TAG="$(printf '%s\n' "${{ steps.meta.outputs.tags }}" | sed -E 's#^.*:##' | grep -v '^latest$' | head -1 || true)"
          if [ -z "$TAG" ]; then
            TAG="$(date -u '+%Y-%m-%d-%H%M')"
          fi

          # 本次真正推过的仓库（可能只有其中一两个）
          HUB_IMG="$(printf '%s\n' "$LIST" | grep -E '^docker\.io/' | head -1 || true)"
          GHCR_IMG="$(printf '%s\n' "$LIST" | grep -E '^ghcr\.io/' | head -1 || true)"
          ALI_IMG="$(printf '%s\n' "$LIST" | grep -E 'aliyuncs\.com' | head -1 || true)"
          FIRST_IMG="$(printf '%s\n' "$LIST" | head -1)"

          # ---------- 更新说明：与镜像 tag 同名的上一个构建标签至今的提交 ----------
          : > "$CHANGELOG"
          PREV_TAG="$(git tag -l --sort=-creatordate | grep -E '^[0-9]{4}-[0-9]{2}-[0-9]{2}-[0-9]{4}$' | grep -v "^${TAG}$" | head -1 || true)"
          if [ -n "$PREV_TAG" ] && git rev-parse -q --verify "$PREV_TAG" >/dev/null 2>&1; then
            git log --pretty='- %s' "${PREV_TAG}..${SHA}" > "$CHANGELOG" || true
          fi
          if [ ! -s "$CHANGELOG" ]; then
            git log --pretty='- %s' -10 "$SHA" > "$CHANGELOG" || true
          fi
          if [ ! -s "$CHANGELOG" ]; then
            echo "- 本次发布" > "$CHANGELOG"
          fi

          # ---------- 组装发布说明 ----------
          {
            echo "## 发布说明"
            echo
            echo "- **构建时间**：$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
            echo "- **提交**：\`${SHA}\`"
            echo "- **镜像标签**：\`latest\`、\`${TAG}\`"
            echo "- **支持架构**：\`${PLATFORMS}\`（多架构 manifest list）"
            echo "- **文件校验**：请使用本次 Release 附带的 \`SHA256SUMS\` 校验下载下来的镜像包（\`sha256sum -c SHA256SUMS\`）"
            echo
            echo "## Docker 镜像"
            echo
            for pair in "GHCR:${GHCR_IMG}" "Docker Hub:${HUB_IMG}" "阿里云:${ALI_IMG}"; do
              label="${pair%%:*}"
              img="${pair#*:}"
              if [ -n "$img" ]; then
                echo "**${label}**"
                echo
                echo '```'
                echo "${img}:latest"
                echo "${img}:${TAG}"
                echo '```'
                echo
              fi
            done
            echo "多架构摘要：\`${DIGEST:-见构建日志}\`"
            echo
            echo "## 附带的镜像包（恢复命令）"
            echo
            echo "打包好的镜像已随本 Release 附带，没网络 / 没有 registry 权限时也能恢复："
            echo
            echo '```bash'
            echo "# 恢复打包的镜像（按服务器架构选一个）"
            echo "docker load -i notepad-${TAG}-linux-amd64.tar    # x86_64"
            echo "docker load -i notepad-${TAG}-linux-arm64.tar    # ARM64"
            echo ""
            echo "# 导入后即为 ${FIRST_IMG}:${TAG}，可直接运行"
            echo "docker run -d --name notepad -p 3000:3000 -e TZ=Asia/Shanghai ${FIRST_IMG}:${TAG}"
            echo '```'
            echo
            if [ -f "$PKG/SHA256SUMS" ]; then
              echo "文件校验："
              echo
              echo '```'
              cat "$PKG/SHA256SUMS"
              echo '```'
              echo
            fi
            echo "## 更新说明"
            echo
            cat "$CHANGELOG"
            echo
            echo "## 快速开始"
            echo
            echo '```bash'
            echo "# 直接用镜像"
            echo "docker run -d --name notepad -p 3000:3000 -e TZ=Asia/Shanghai ${GHCR_IMG:-${HUB_IMG:-${ALI_IMG}}}:latest"
            echo ""
            echo "# 或者用仓库里的 compose"
            echo "git clone https://github.com/$REPO.git && cd notepad && docker compose up -d"
            echo '```'
            echo
            echo "## 可用环境变量"
            echo
            echo "| 变量 | 说明 |"
            echo "|---|---|"
            echo '| `SITE_TITLE` / `SITE_DESCRIPTION` / `SITE_KEYWORDS` / `SITE_AUTHOR` | 页面元信息（运行期注入 index.html，改完重启容器即生效） |'
            echo '| `SITE_LANG` | 默认界面语言：`auto`（默认，跟随浏览器）/ `zh` / `en`；访客自己选过的语言优先 |'
            echo '| `TZ` | 时区，容器内 cron 按它计算（默认 UTC） |'
            echo '| `ARCHIVE_CRON` | 每日归档时间，默认 `30 3 * * *`，设 `off` 关闭 |'
            echo
            echo "## 特性"
            echo
            echo "- 🔐 笔记在客户端加密后才上传（服务端只有密文）"
            echo "- 🌐 中英双语 + 头部语言切换（自动识别浏览器语言并用 localStorage 记忆）"
            echo "- 🔎 首页预渲染成静态 HTML，便于搜索引擎收录"
            echo "- 💾 容器内每日自动归档到 \`backend/public/backups/\`"
            echo "- 🧱 多架构镜像：${PLATFORMS}"
          } > "$NOTES"

          # ---------- 创建 / 更新 Release，并上传镜像包与校验文件 ----------
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$REPO" --title "镜像 $TAG" --notes-file "$NOTES"
          else
            gh release create "$TAG" --repo "$REPO" --title "镜像 $TAG" --target "$SHA" --notes-file "$NOTES" --latest
          fi

          if ls "$PKG"/*.tar >/dev/null 2>&1; then
            gh release upload "$TAG" "$PKG"/*.tar "$PKG/SHA256SUMS" --repo "$REPO" --clobber
          fi

          echo "Release 已就绪：$TAG"
          ls -lh "$PKG" || true

          {
            echo ""
            echo "### 📦 Release"
            echo ""
            echo "- https://github.com/$REPO/releases/tag/$TAG"
            echo ""
            echo "附件："
            echo '```'
            ls -l "$PKG" | tail -n +2
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
