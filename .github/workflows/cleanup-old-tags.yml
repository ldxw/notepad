name: 清理旧的镜像时间标签

# 只清理「构建时间格式」的标签（形如 2026-10-10-0127），每个仓库只保留最新的那一个。
# 其它历史标签（var-re*、2025*、20250428* 这些早期手动推的）一律不动；latest 也不动。
on:
  workflow_dispatch:
    inputs:
      dryRun:
        description: "演练模式：只列出将要删除的标签，不真的删"
        type: boolean
        default: true
      pruneHub:
        description: "处理 Docker Hub（docker.io/ldxw/notepad）"
        type: boolean
        default: true
      pruneGhcr:
        description: "处理 GitHub Packages（ghcr.io/ldxw/notepad）"
        type: boolean
        default: true
      pruneAliyun:
        description: "处理阿里云（registry.cn-hangzhou.aliyuncs.com/ldxw-git/notepad）"
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

jobs:
  prune:
    runs-on: ubuntu-latest

    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      ALIYUN_DOCKER_USERNAME: ${{ secrets.ALIYUN_DOCKER_USERNAME }}
      ALIYUN_DOCKER_TOKEN: ${{ secrets.ALIYUN_DOCKER_TOKEN }}
      INPUT_DRY: ${{ inputs.dryRun }}
      INPUT_HUB: ${{ inputs.pruneHub }}
      INPUT_GHCR: ${{ inputs.pruneGhcr }}
      INPUT_ALIYUN: ${{ inputs.pruneAliyun }}

    steps:
      - name: 🔒 登录 Docker Hub
        if: env.INPUT_HUB == 'true' && env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: 🔒 登录 GitHub Packages (ghcr.io)
        if: env.INPUT_GHCR == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔒 登录阿里云 Docker 镜像仓库
        if: env.INPUT_ALIYUN == 'true' && env.ALIYUN_DOCKER_TOKEN != ''
        uses: docker/login-action@v3
        with:
          registry: registry.cn-hangzhou.aliyuncs.com
          username: ${{ env.ALIYUN_DOCKER_USERNAME }}
          password: ${{ env.ALIYUN_DOCKER_TOKEN }}

      - name: 🧹 清理旧的时间标签
        run: |
          set -euo pipefail

          CRANE=/tmp/crane
          curl -sSL -o /tmp/crane.tgz \
            "https://github.com/google/go-containerregistry/releases/download/v0.22.1/go-containerregistry_Linux_x86_64.tar.gz"
          tar -xzf /tmp/crane.tgz -C /tmp crane
          "$CRANE" version

          # 只认这种格式的标签，其它一律当历史标签放过
          TAG_RE='^[0-9]{4}-[0-9]{2}-[0-9]{2}-[0-9]{4}$'
          DRY="${INPUT_DRY:-true}"

          if [ "$DRY" = "true" ]; then
            echo "::notice::演练模式：只列出，不删除"
          fi

          prune() {

            img="$1"
            echo "=== $img ==="

            tags="$("$CRANE" ls "$img" 2>/dev/null || true)"

            if [ -z "$tags" ]; then
              echo "  （列不出标签，跳过）"
              return 0
            fi

            mine="$(printf '%s\n' "$tags" | grep -E "$TAG_RE" || true)"

            if [ -z "$mine" ]; then
              echo "  没有构建时间标签，跳过"
              return 0
            fi

            newest="$(printf '%s\n' "$mine" | sort | tail -1)"
            echo "  最新的时间标签（保留）：$newest"
            echo "  历史标签（不动）：$(printf '%s\n' "$tags" | grep -vE "$TAG_RE" | tr '\n' ' ')"

            printf '%s\n' "$mine" | sort | while IFS= read -r t; do

              [ -z "$t" ] && continue
              [ "$t" = "$newest" ] && continue

              if [ "$DRY" = "true" ]; then
                echo "  [演练] 将删除 $img:$t"
              elif "$CRANE" delete "$img:$t" >/dev/null 2>&1; then
                echo "  ✅ 已删除 $img:$t"
              else
                echo "  ⚠️ 删除失败（可能该仓库不允许删除清单）$img:$t"
              fi
            done
          }

          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"

          {
            echo "### 🧹 旧时间标签清理（$([ "$DRY" = "true" ] && echo 演练 || echo 实际执行)）"
            echo ""
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${INPUT_GHCR:-true}" = "true" ]; then
            prune "ghcr.io/${owner}/notepad" || true
          fi

          if [ "${INPUT_HUB:-true}" = "true" ] && [ -n "${DOCKERHUB_USERNAME:-}" ]; then
            prune "docker.io/${DOCKERHUB_USERNAME}/notepad" || true
          fi

          if [ "${INPUT_ALIYUN:-true}" = "true" ]; then
            prune "registry.cn-hangzhou.aliyuncs.com/ldxw-git/notepad" || true
          fi

          echo '```' >> "$GITHUB_STEP_SUMMARY"
